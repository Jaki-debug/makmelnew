      <div class="section-title">Administration</div>

      

      <!-- Notifications -->
    

      <!-- Utilisateurs -->
      <a
        *ngIf="hasPermission('users.read')"

        routerLinkActive="active"
        class="menu-item">

        <span class="menu-icon">

      <a
        *ngIf="hasPermission('roles.read')"

          <svg viewBox="0 0 24 24" aria-hidden="true">
