<div class="connexion-page"> <div class="connexion-container">
<div class="connexion-card">

  <div class="connexion-header">

    <span class="page-label">
      ESPACE CLIENT
    </span>

    <h1>
      Bienvenue
    </h1>

    <p>
      Connectez-vous à votre compte pour continuer.
    </p>

  </div>

  <div
    class="message error"
    *ngIf="erreur"
  >
    {{ erreur }}
  </div>

  <form
    #connexionForm="ngForm"
    (ngSubmit)="seConnecter()"
  >

    <div class="form-group">

      <label for="identifier">
        Email ou téléphone
      </label>

      <input
        id="identifier"
        type="text"
        name="identifier"
        [(ngModel)]="identifier"
        placeholder="Votre email ou numéro de téléphone"
        autocomplete="username"
        [disabled]="chargement"
        required
      />

    </div>

    <div class="form-group">

      <label for="password">
        Mot de passe
      </label>

      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
        [disabled]="chargement"
        required
      />

    </div>

    <button
      type="submit"
      class="connexion-button"
      [disabled]="chargement || !connexionForm.valid"
    >
      {{ chargement ? 'Connexion...' : 'Se connecter' }}
    </button>

  </form>

  <div class="inscription-section">

    <span>
      Vous n'avez pas encore de compte ?
    </span>

    <button
      type="button"
      class="inscription-link"
      (click)="allerInscription()"
      [disabled]="chargement"
    >
      Créer un compte
    </button>

  </div>

  <button
    type="button"
    class="retour-button"
    (click)="retourAccueil()"
    [disabled]="chargement"
  >
    Retour à l'accueil
  </button>

</div>
</div> </div>
