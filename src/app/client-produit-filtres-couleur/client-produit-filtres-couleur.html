
<form class="filters-form" (ngSubmit)="appliquerFiltres()">

  <!-- PRIX -->
  <section class="filter-group">
    <h3 class="filter-title">Prix</h3>

    <p class="filter-description">
      Définissez votre budget en FCFA.
    </p>

    <div class="price-fields">
      <div class="filter-field">
        <label for="minPrice">Minimum</label>
        <input
          id="minPrice"
          name="minPrice"
          type="number"
          min="0"
          step="1"
          placeholder="0"
          [(ngModel)]="minPrice">
      </div>

      <span class="price-separator">—</span>

      <div class="filter-field">
        <label for="maxPrice">Maximum</label>
        <input
          id="maxPrice"
          name="maxPrice"
          type="number"
          min="0"
          step="1"
          placeholder="Ex. 25000"
          [(ngModel)]="maxPrice">
      </div>
    </div>
  </section>

  <!-- TAILLE -->
  <section class="filter-group">
    <h3 class="filter-title">Taille</h3>

    <label class="filter-label" for="size">
      Taille recherchée
    </label>

    <select
      id="size"
      name="size"
      [(ngModel)]="size">

      <option value="">Toutes les tailles</option>
      <option value="XS">XS</option>
      <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
      <option value="XXL">XXL</option>
    </select>
  </section>

  <!-- COULEUR -->
  <section class="filter-group">
    <h3 class="filter-title">Couleur</h3>

    <label class="filter-label" for="color">
      Couleur recherchée
    </label>

    <input
      id="color"
      name="color"
      type="text"
      placeholder="Ex. noir, blanc, rouge..."
      [(ngModel)]="color">
  </section>

  <!-- MARQUE -->
  <section class="filter-group">
    <h3 class="filter-title">Marque</h3>

    <label class="filter-label" for="brand">
      Nom de la marque
    </label>

    <input
      id="brand"
      name="brand"
      type="text"
      placeholder="Saisir une marque"
      [(ngModel)]="brand">
  </section>

  <!-- DISPONIBILITÉ -->
  <section class="filter-group">
    <h3 class="filter-title">Disponibilité</h3>

    <label class="filter-label" for="disponibilite">
      État du stock
    </label>

    <select
      id="disponibilite"
      name="disponibilite"
      [(ngModel)]="disponibilite">

      <option value="all">Tous les produits</option>
      <option value="available">En stock</option>
      <option value="unavailable">Rupture de stock</option>
    </select>
  </section>

  <!-- MESSAGE D'ERREUR -->
  <div
    *ngIf="erreur"
    class="filter-error"
    role="alert">

    <span aria-hidden="true">!</span>
    <p>{{ erreur }}</p>
  </div>

  <!-- ACTIONS -->
  <div class="filter-actions">
    <button
      type="submit"
      class="btn-apply-filters">

      Appliquer les filtres
    </button>

    <button
      type="button"
      class="btn-clear-filters"
      (click)="reinitialiserFiltres()">

      Réinitialiser
    </button>
  </div>

</form>
