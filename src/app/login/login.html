<div class="login"> <div class="login-card">
<div class="logo">
  MAK & MEL
</div>

<h1>
  Connexion
</h1>

<p class="subtitle">
  Accédez au Backoffice
</p>

<div
  class="login-error"
  *ngIf="erreur">

  {{ erreur }}

</div>

<form
  (ngSubmit)="seConnecter()">

  <div class="form-group">

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Entrez votre email"
      required
    >

  </div>

  <div class="form-group">

    <label for="password">
      Mot de passe
    </label>

    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="motDePasse"
      placeholder="Entrez votre mot de passe"
      required
    >

  </div>

  <button
    type="submit"
    [disabled]="chargement">

    <span *ngIf="!chargement">
      Se connecter
    </span>

    <span *ngIf="chargement">
      Connexion...
    </span>

  </button>

</form>
</div> </div>
