<div class="inscription-page">

<div class="inscription-container">
<div class="inscription-brand" (click)="retourAccueil()">
  <div class="brand-logo">M</div>
  <span>Mak & Mel</span>
</div>

<div class="inscription-card">

  <div class="inscription-header">
    <h1>Créer votre compte</h1>
    <p>Rejoignez Mak & Mel et profitez de votre expérience shopping.</p>
  </div>

  <form (ngSubmit)="sInscrire()">

    <div class="form-row">

      <div class="form-group">
        <label for="firstName">Prénom</label>

        <input
          id="firstName"
          type="text"
          name="firstName"
          [(ngModel)]="firstName"
          placeholder="Votre prénom"
          autocomplete="given-name"
        />
      </div>

      <div class="form-group">
        <label for="lastName">Nom</label>

        <input
          id="lastName"
          type="text"
          name="lastName"
          [(ngModel)]="lastName"
          placeholder="Votre nom"
          autocomplete="family-name"
        />
      </div>

    </div>

    <div class="form-group">
      <label for="email">Adresse email</label>

      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="email@exemple.com"
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label for="phone">Numéro de téléphone</label>

      <input
        id="phone"
        type="tel"
        name="phone"
        [(ngModel)]="phone"
        placeholder="Ex. +228 90 00 00 00"
        autocomplete="tel"
      />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>

      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Minimum 8 caractères"
        autocomplete="new-password"
      />
    </div>

    <div class="error-message" *ngIf="erreur">
      {{ erreur }}
    </div>

    <button
      type="submit"
      class="inscription-button"
      [disabled]="chargement"
    >
      <span *ngIf="!chargement">Créer mon compte</span>
      <span *ngIf="chargement">Création du compte...</span>
    </button>

  </form>

  <div class="inscription-footer">
    <span>Vous avez déjà un compte ?</span>

    <button
      type="button"
      class="connexion-link"
      (click)="allerConnexion()"
    >
      Se connecter
    </button>
  </div>

</div>
</div> </div>
