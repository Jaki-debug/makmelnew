<div class="page"> <div class="page-header">
<div>

  <button
    type="button"
    class="back-button"
    (click)="annuler()">

    ← Retour au rôle

  </button>

  <h1>
    Modifier le rôle
  </h1>

  <p>
    Modifier les informations du rôle.
  </p>

</div>
</div> <div class="loading" *ngIf="chargement">
Chargement du rôle...
</div> <div class="error-message" *ngIf="!chargement && erreur">
{{ erreur }}
</div> <div class="card" *ngIf="!chargement && hasPermission('roles.update')">
<form
  (ngSubmit)="enregistrer()">

  <div class="form-group">

    <label for="nom">
      Nom du rôle
    </label>

    <input
      id="nom"
      name="nom"
      type="text"
      [(ngModel)]="nom"
      placeholder="Nom du rôle"
      required
      [disabled]="enregistrement">

  </div>

  <div class="form-group">

    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      name="description"
      [(ngModel)]="description"
      placeholder="Description du rôle"
      rows="5"
      [disabled]="enregistrement">
    </textarea>

  </div>

  <div
    class="error-message"
    *ngIf="erreur">

    {{ erreur }}

  </div>

  <div
    class="success-message"
    *ngIf="succes">

    {{ succes }}

  </div>

  <div class="actions">

    <button
      type="button"
      class="secondary-button"
      (click)="annuler()"
      [disabled]="enregistrement">

      Annuler

    </button>

    <button
      type="submit"
      class="primary-button"
      [disabled]="enregistrement">

      {{ enregistrement
        ? 'Enregistrement...'
        : 'Enregistrer les modifications' }}

    </button>

  </div>

</form>
</div> </div>
